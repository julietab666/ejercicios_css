<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cascada CSS</title>
    <style>
        p { color: blue; }
        p { color: green; }
        .destacado { color: orange; }
        #unico { color: red; }
    </style>
</head>
<body>
    <p>¿De qué color soy? Verde</p>
    <p class="destacado">¿Y yo? Naranja</p>
    <p class="destacado" id="unico">¿Y yo qué color tengo? Rojo</p>
    <p class="destacado" id="unico"
       style="color: purple;">¿Y ahora? Violeta</p>
</body>
</html>
